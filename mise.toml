[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "24.22.0"
jactionlint = "2.2.0"
goreleaser = "2.18.3"
"aqua:WebAssembly/binaryen" = "133"
"aqua:anchore/syft" = "1.54.1"

[tasks."actions:lint"]
description = "Lint GitHub Actions workflows"
run = "jactionlint .github/workflows/*.yml"

[tasks.test]
description = "Run the MCL test suite"
run = "go test ./..."

[tasks.check]
description = "Run Go static checks"
run = "go vet ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks."go:format:check"]
description = "Check Go source formatting"
run = '''
files="$(gofmt -l .)"
if [ -n "$files" ]; then
  printf '%s\n' "$files"
  exit 1
fi
'''

[tasks."quality:check"]
description = "Run core Go and WebAssembly quality checks"
depends = ["test", "check", "lint", "go:format:check", "wasm:check"]

[tasks."wasm:check"]
description = "Build and verify the browser WebAssembly runtime"
run = "node ./cmd/mcl-wasm/check.mjs"

[tasks."wasm:build"]
description = "Build the Browser SDK WebAssembly runtime"
run = "node ./packages/browser/scripts/build-wasm.mjs"

[tasks."release:wasm"]
description = "Stage the Browser SDK WebAssembly release assets"
run = '''
set -eu
mkdir -p .build/release-assets
cp packages/browser/dist/mcl.wasm .build/release-assets/mcl.wasm
cp packages/browser/dist/wasm_exec.js .build/release-assets/wasm_exec.js
gzip -9 -n -f .build/release-assets/mcl.wasm
gzip -dc .build/release-assets/mcl.wasm.gz | cmp - packages/browser/dist/mcl.wasm
'''

[tasks."release:package"]
description = "Package CLI and WebAssembly release assets with checksums"
run = '''
set -eu
rm -rf dist
mise run release:reference
if [ "${MCL_RELEASE_ASSETS_STAGED:-false}" != true ]; then
  mise run wasm:build
  mise run release:wasm
fi
case "${MCL_RELEASE_MODE:-snapshot}" in
  snapshot)
    : "${MCL_VERSION:?MCL_VERSION must be set to a release version}"
    goreleaser release --snapshot --clean
    ;;
  release) goreleaser release --clean ;;
  *) printf 'Unsupported MCL_RELEASE_MODE: %s\n' "$MCL_RELEASE_MODE" >&2; exit 1 ;;
esac
(cd dist && sha256sum --check SHA256SUMS)
'''

[tasks."release:reference"]
description = "Generate CLI and standard library reference release assets"
run = '''
set -eu
: "${MCL_VERSION:?MCL_VERSION must be set to a release version}"
rm -rf .build/reference
go run ./cmd/mcl reference --output .build/reference --version "$MCL_VERSION"
'''
