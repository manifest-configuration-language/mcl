[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "24.22.0"
jactionlint = "2.2.0"
goreleaser = "2.18.3"
"aqua:anchore/syft" = "1.54.1"

[tasks."actions:lint"]
description = "Lint GitHub Actions workflows"
run = "jactionlint .github/workflows/*.yml"

[tasks.test]
description = "Run the MCL test suite"
run = "go test ./..."

[tasks.check]
description = "Run Go static checks"
run = "go vet ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks."go:format:check"]
description = "Check Go source formatting"
run = '''
files="$(gofmt -l .)"
if [ -n "$files" ]; then
  printf '%s\n' "$files"
  exit 1
fi
'''

[tasks."quality:check"]
description = "Run core Go and WebAssembly quality checks"
depends = ["test", "check", "lint", "go:format:check", "wasm:check"]

[tasks."wasm:check"]
description = "Build and verify the browser WebAssembly runtime"
run = "node ./cmd/mcl-wasm/check.mjs"

[tasks."release:cli"]
description = "Build and archive release CLI binaries with GoReleaser"
run = '''
set -eu
: "${MCL_VERSION:?MCL_VERSION must be set to a release version}"
goreleaser release --snapshot --clean
'''

[tasks."release:wasm"]
description = "Build Playground WebAssembly release assets"
run = '''
set -eu
mkdir -p .build/release-assets
if [ -n "${MCL_RELEASE_WASM_SOURCE:-}" ]; then
  test -f "$MCL_RELEASE_WASM_SOURCE/mcl.wasm"
  test -f "$MCL_RELEASE_WASM_SOURCE/wasm_exec.js"
  cp "$MCL_RELEASE_WASM_SOURCE/mcl.wasm" .build/release-assets/mcl.wasm
  cp "$MCL_RELEASE_WASM_SOURCE/wasm_exec.js" .build/release-assets/wasm_exec.js
else
  GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o .build/release-assets/mcl.wasm ./cmd/mcl-wasm
  cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" .build/release-assets/wasm_exec.js
fi
gzip -9 -n -f .build/release-assets/mcl.wasm
'''

[tasks."release:package"]
description = "Package CLI and WebAssembly release assets with checksums"
run = '''
set -eu
rm -rf dist .build/release-assets
mise run release:wasm
case "${MCL_RELEASE_MODE:-snapshot}" in
  snapshot) mise run release:cli ;;
  release) goreleaser release --clean ;;
  *) printf 'Unsupported MCL_RELEASE_MODE: %s\n' "$MCL_RELEASE_MODE" >&2; exit 1 ;;
esac
(cd dist && sha256sum --check SHA256SUMS)
'''
