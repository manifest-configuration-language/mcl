version: 2

project_name: mcl

builds:
  - id: cli
    main: ./cmd/mcl
    binary: mcl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X=github.com/manifest-configuration-language/mcl/internal/engine.ToolchainVersion={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cli
    ids:
      - cli
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - none*
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  disable: true

changelog:
  disable: true

snapshot:
  version_template: "{{ .Env.MCL_VERSION }}"
