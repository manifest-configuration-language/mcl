version: 2

project_name: mcl

builds:
  - id: cli
    main: ./cmd/mcl
    binary: mcl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X=github.com/manifest-configuration-language/mcl/internal/engine.ToolchainVersion={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cli
    ids:
      - cli
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - none*
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: wasm
    meta: true
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_wasm"
    files:
      - src: ./.build/release-assets/mcl.wasm.gz
        dst: mcl.wasm.gz
      - src: ./.build/release-assets/wasm_exec.js
        dst: wasm_exec.js

sboms:
  - artifacts: archive

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  github:
    owner: manifest-configuration-language
    name: mcl
  name_template: "MCL {{ .Version }}"
  draft: true
  replace_existing_draft: true

changelog:
  use: git

snapshot:
  version_template: "{{ .Env.MCL_VERSION }}"
