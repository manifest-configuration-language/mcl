name: Verify release
description: Run the checks required before building release assets
inputs:
  package-output-directory:
    description: Directory for the packed npm package archives
    required: false
    default: ''
  expected-version:
    description: Expected version for the packed npm package archives
    required: false
    default: ''
  reference-version:
    description: Version to write into generated reference documents
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Run release checks
      shell: bash
      run: mise run quality:check

    - name: Validate GoReleaser configuration
      shell: bash
      run: goreleaser check

    - name: Prepare release WebAssembly assets
      shell: bash
      run: mise run release:wasm

    - name: Install npm package workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate reference package contents
      shell: bash
      env:
        MCL_VERSION: ${{ inputs.reference-version || inputs.expected-version }}
      run: mise run release:reference

    - name: Check language grammar parity
      shell: bash
      run: pnpm --filter @manifest-configuration-language/language run check:parity

    - name: Pack and verify npm packages
      shell: bash
      env:
        PACKAGE_OUTPUT_DIRECTORY: ${{ inputs.package-output-directory }}
        MCL_VERSION: ${{ inputs.expected-version }}
      run: |
        if [[ -n "$PACKAGE_OUTPUT_DIRECTORY" ]]; then
          scripts/verify-package-tarballs.sh "$PACKAGE_OUTPUT_DIRECTORY" --prebuilt-browser-wasm
        else
          scripts/verify-package-tarballs.sh --prebuilt-browser-wasm
        fi
