name: Publish npm Packages
run-name: Publish npm packages ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose package versions should be published.
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false
      - name: Validate release tag and package versions
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "Dispatch this workflow from the default branch." >&2
              exit 1
            fi
            release_tag="$RELEASE_TAG_INPUT"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$release_tag" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            printf 'Release tag %s is not present in the checked out source.\n' "$release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          for package in browser language; do
            version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "v$version" != "$release_tag" ]; then
              printf 'Tag %s does not match %s package version %s\n' "$release_tag" "$package" "$version" >&2
              exit 1
            fi
          done
          release="$(gh release view "$release_tag" --json tagName,isDraft,assets)"
          version="${release_tag#v}"
          required_assets=(
            "mcl_${version}_darwin_amd64.tar.gz"
            "mcl_${version}_darwin_arm64.tar.gz"
            "mcl_${version}_linux_amd64.tar.gz"
            "mcl_${version}_linux_arm64.tar.gz"
            "mcl_${version}_windows_amd64.zip"
            "mcl_${version}_windows_arm64.zip"
            "mcl_${version}_wasm.tar.gz"
            "SHA256SUMS"
          )
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64 windows_arm64; do
            case "$platform" in
              windows_*) archive_ext=zip ;;
              *) archive_ext=tar.gz ;;
            esac
            required_assets+=("mcl_${version}_${platform}.${archive_ext}.sbom.json")
          done
          jq -e --arg tag "$release_tag" '.tagName == $tag and .isDraft == false' <<< "$release" >/dev/null
          for asset in "${required_assets[@]}"; do
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$release" >/dev/null; then
              printf 'Release %s is missing required asset %s\n' "$release_tag" "$asset" >&2
              exit 1
            fi
          done
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_assets"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mcl_*' --pattern SHA256SUMS --dir "$release_assets"
          (cd "$release_assets" && sha256sum --check SHA256SUMS)

      - name: Install browser package dependencies
        run: cd packages/browser && npm ci
      - name: Install Playwright browsers
        run: cd packages/browser && npx playwright install --with-deps chromium firefox webkit
      - name: Test browser package
        run: cd packages/browser && npm run test:browser
      - name: Validate browser package archive
        run: |
          set -euo pipefail
          cd packages/browser
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/browser-pack.json"
          node - "$RUNNER_TEMP/browser-pack.json" dist/mcl.wasm dist/wasm_exec.js <<'NODE'
          const fs = require('node:fs');
          const [archive, ...required] = process.argv.slice(2);
          const packed = JSON.parse(fs.readFileSync(archive, 'utf8'))[0];
          const files = packed.files.map(({ path }) => path);
          const missing = required.filter((path) => !files.includes(path));
          if (missing.length) throw new Error(`Browser package is missing: ${missing.join(', ')}`);
          if (!fs.existsSync(`${process.env.RUNNER_TEMP}/${packed.filename}`)) throw new Error(`Browser tarball is missing: ${packed.filename}`);
          NODE
      - name: Install language package dependencies
        run: cd packages/language && npm ci
      - name: Check language grammar parity
        run: cd packages/language && npm run check:parity
      - name: Validate language package archive
        run: |
          set -euo pipefail
          cd packages/language
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/language-pack.json"
          node - "$RUNNER_TEMP/language-pack.json" src/parser.js src/mcl.tmLanguage.json <<'NODE'
          const fs = require('node:fs');
          const [archive, ...required] = process.argv.slice(2);
          const packed = JSON.parse(fs.readFileSync(archive, 'utf8'))[0];
          const files = packed.files.map(({ path }) => path);
          const missing = required.filter((path) => !files.includes(path));
          if (missing.length) throw new Error(`Language package is missing: ${missing.join(', ')}`);
          if (!fs.existsSync(`${process.env.RUNNER_TEMP}/${packed.filename}`)) throw new Error(`Language tarball is missing: ${packed.filename}`);
          NODE
      - name: Pack and smoke test release archives
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/verify-package-tarballs.sh
      - name: Check published packages against release tarballs
        id: packages
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          publish_list="$RUNNER_TEMP/packages-to-publish.txt"
          : > "$publish_list"
          for package in browser language; do
            tarball="$RUNNER_TEMP/mcl-${package}-${MCL_VERSION}.tgz"
            if [ ! -f "$tarball" ]; then
              printf 'Expected package tarball is missing: %s\n' "$tarball" >&2
              exit 1
            fi
            expected_integrity="sha512-$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
            registry_error="$RUNNER_TEMP/${package}-registry-check.txt"
            if registry_integrity="$(npm view "@mcl/$package@$MCL_VERSION" dist.integrity 2>"$registry_error")"; then
              if [ "$registry_integrity" != "$expected_integrity" ]; then
                printf 'Published @mcl/%s@%s does not match this run’s tarball (expected %s, found %s).\n' \
                  "$package" "$MCL_VERSION" "$expected_integrity" "$registry_integrity" >&2
                exit 1
              fi
              printf 'Verified existing @mcl/%s@%s against this run’s tarball.\n' "$package" "$MCL_VERSION"
            elif ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
              cat "$registry_error" >&2
              printf 'Could not verify npm package availability for @mcl/%s@%s.\n' "$package" "$MCL_VERSION" >&2
              exit 1
            else
              printf '%s\n' "$package" >> "$publish_list"
            fi
          done
          echo "publish_list=$publish_list" >> "$GITHUB_OUTPUT"
      - name: Publish packages
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_LIST: ${{ steps.packages.outputs.publish_list }}
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            npm publish "$RUNNER_TEMP/mcl-${package}-${MCL_VERSION}.tgz" --access public --provenance
          done < "$PUBLISH_LIST"

      - name: Smoke test published packages
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          cat > "$smoke_directory/package.json" <<EOF
          {"private":true,"dependencies":{"@mcl/browser":"$MCL_VERSION","@mcl/language":"$MCL_VERSION"}}
          EOF
          npm install --prefix "$smoke_directory" --ignore-scripts --no-audit --no-fund
          (cd "$smoke_directory" && npm audit signatures)
          cp "$GITHUB_WORKSPACE/scripts/verify-installed-packages.mjs" "$smoke_directory/verify-installed-packages.mjs"
          (cd "$smoke_directory" && node verify-installed-packages.mjs)
