name: Publish npm Packages
run-name: Publish npm packages ${{ github.event.workflow_run.head_sha }}

on:
  # This workflow accepts artifacts only from a successful same-repository Release run, verifies the
  # matching tag and source SHA, and checks the downloaded tarball hashes before npm publishes them.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false
      - name: Validate release tag and package versions
        id: release
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$UPSTREAM_EVENT" != push ] || [ "$UPSTREAM_CONCLUSION" != success ] || [ "$UPSTREAM_HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
            echo "Only successful Release workflows from this repository can publish packages." >&2
            exit 1
          fi
          release_tag=""
          for package in browser language; do
            version="$(node -p "require('./packages/${package}/package.json').version")"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              printf 'Invalid %s package version: %s\n' "$package" "$version" >&2
              exit 1
            fi
          done
          browser_version="$(node -p "require('./packages/browser/package.json').version")"
          language_version="$(node -p "require('./packages/language/package.json').version")"
          if [ "$browser_version" != "$language_version" ]; then
            printf 'Package versions do not match: browser=%s language=%s\n' "$browser_version" "$language_version" >&2
            exit 1
          fi
          version="$browser_version"
          release_tag="v$version"
          checked_out_sha="$(git rev-parse 'HEAD^{commit}')"
          tag_sha="$(git rev-parse --verify "refs/tags/$release_tag^{commit}")"
          if [ "$checked_out_sha" != "$UPSTREAM_HEAD_SHA" ] || [ "$tag_sha" != "$UPSTREAM_HEAD_SHA" ]; then
            printf 'Release tag %s does not resolve to the completed Release commit %s.\n' "$release_tag" "$UPSTREAM_HEAD_SHA" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release="$(gh release view "$release_tag" --json tagName,isDraft,assets)"
          required_assets=(
            "mcl_${version}_darwin_amd64.tar.gz"
            "mcl_${version}_darwin_arm64.tar.gz"
            "mcl_${version}_linux_amd64.tar.gz"
            "mcl_${version}_linux_arm64.tar.gz"
            "mcl_${version}_windows_amd64.zip"
            "mcl_${version}_windows_arm64.zip"
            "mcl_${version}_wasm.tar.gz"
            "SHA256SUMS"
          )
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64 windows_arm64; do
            case "$platform" in
              windows_*) archive_ext=zip ;;
              *) archive_ext=tar.gz ;;
            esac
            required_assets+=("mcl_${version}_${platform}.${archive_ext}.sbom.json")
          done
          jq -e --arg tag "$release_tag" '.tagName == $tag and .isDraft == false' <<< "$release" >/dev/null
          for asset in "${required_assets[@]}"; do
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$release" >/dev/null; then
              printf 'Release %s is missing required asset %s\n' "$release_tag" "$asset" >&2
              exit 1
            fi
          done
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_assets"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mcl_*' --pattern SHA256SUMS --dir "$release_assets"
          (cd "$release_assets" && sha256sum --check SHA256SUMS)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-npm-${{ steps.release.outputs.version }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Validate npm tarball artifact
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_directory="$RUNNER_TEMP/mcl-npm-packages"
          expected_files="mcl-browser-${MCL_VERSION}.tgz
          mcl-language-${MCL_VERSION}.tgz
          SHA512SUMS"
          actual_files="$(for file in "$package_directory"/*; do [ -f "$file" ] && basename "$file"; done | sort)"
          if [ "$actual_files" != "$(printf '%s\n' "$expected_files" | sort)" ]; then
            printf 'Unexpected npm tarball artifact files:\n%s\n' "$actual_files" >&2
            exit 1
          fi
          (cd "$package_directory" && sha512sum --check SHA512SUMS)
      - name: Check published packages against release tarballs
        id: packages
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          publish_list="$RUNNER_TEMP/packages-to-publish.txt"
          : > "$publish_list"
          for package in browser language; do
            tarball="$RUNNER_TEMP/mcl-npm-packages/mcl-${package}-${MCL_VERSION}.tgz"
            if [ ! -f "$tarball" ]; then
              printf 'Expected package tarball is missing: %s\n' "$tarball" >&2
              exit 1
            fi
            expected_integrity="sha512-$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
            registry_error="$RUNNER_TEMP/${package}-registry-check.txt"
            if registry_integrity="$(npm view "@mcl/$package@$MCL_VERSION" dist.integrity 2>"$registry_error")"; then
              if [ "$registry_integrity" != "$expected_integrity" ]; then
                printf "Published @mcl/%s@%s does not match this run's tarball (expected %s, found %s).\n" \
                  "$package" "$MCL_VERSION" "$expected_integrity" "$registry_integrity" >&2
                exit 1
              fi
              printf "Verified existing @mcl/%s@%s against this run's tarball.\n" "$package" "$MCL_VERSION"
            elif ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
              cat "$registry_error" >&2
              printf 'Could not verify npm package availability for @mcl/%s@%s.\n' "$package" "$MCL_VERSION" >&2
              exit 1
            else
              printf '%s\n' "$package" >> "$publish_list"
            fi
          done
          echo "publish_list=$publish_list" >> "$GITHUB_OUTPUT"
      - name: Publish packages
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_LIST: ${{ steps.packages.outputs.publish_list }}
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            npm publish "$RUNNER_TEMP/mcl-npm-packages/mcl-${package}-${MCL_VERSION}.tgz" --access public --provenance
          done < "$PUBLISH_LIST"

      - name: Smoke test published packages
        env:
          MCL_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          cat > "$smoke_directory/package.json" <<EOF
          {"private":true,"dependencies":{"@mcl/browser":"$MCL_VERSION","@mcl/language":"$MCL_VERSION"}}
          EOF
          npm install --prefix "$smoke_directory" --ignore-scripts --no-audit --no-fund
          (cd "$smoke_directory" && npm audit signatures)
          cp "$GITHUB_WORKSPACE/scripts/verify-installed-packages.mjs" "$smoke_directory/verify-installed-packages.mjs"
          (cd "$smoke_directory" && node verify-installed-packages.mjs)
