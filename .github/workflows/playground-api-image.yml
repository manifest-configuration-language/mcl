name: Playground API image

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/playground-api-image.yml
      - cmd/mcl-playground-api/**
      - go.mod
      - go.sum
      - internal/**
      - pkg/**
  pull_request:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/playground-api-image.yml
      - cmd/mcl-playground-api/**
      - go.mod
      - go.sum
      - internal/**
      - pkg/**

permissions:
  contents: read

concurrency:
  group: playground-api-image-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/mcl-playground-api/Dockerfile
          push: false
          cache-from: type=gha,scope=mcl-playground-api

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ghcr.io/manifest-configuration-language/mcl-playground-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/mcl-playground-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:main
          sbom: true
          cache-from: type=gha,scope=mcl-playground-api
          cache-to: type=gha,scope=mcl-playground-api,mode=max

      - name: Record image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest image provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
