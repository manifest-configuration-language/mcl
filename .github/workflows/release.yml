name: Release
run-name: Release next ${{ inputs.bump }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ幅"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "公開チャネル"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    cache-mode: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.tag }}
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Release workflows must run from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Wait for main CI to appear
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout=60
          deadline=$((SECONDS + timeout))
          while true; do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch main \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || true)"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              printf 'Timed out after %ss waiting for CI to register.\n' \
                "$timeout" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Wait for main CI to finish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        run: |
          gh run watch "$RUN_ID" --exit-status --compact

      - name: Determine release version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            printf 'A stable vX.Y.Z tag is required to determine the next version.\n' >&2
            exit 1
          fi
          if [[ "$CHANNEL" == stable && "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            printf 'Commit %s is already released as %s.\n' "$GITHUB_SHA" "$latest" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              printf 'Invalid version bump: %s\n' "$BUMP" >&2
              exit 1
              ;;
          esac
          version="${major}.${minor}.${patch}"
          if [[ "$CHANNEL" == rc ]]; then
            previous="$(git tag --list "v${version}-rc.*" | sort -V | tail -n 1)"
            number=1
            if [[ -n "$previous" ]]; then
              if [[ "$(git rev-list -n 1 "$previous")" == "$GITHUB_SHA" ]]; then
                printf 'Commit %s is already released as %s.\n' "$GITHUB_SHA" "$previous" >&2
                exit 1
              fi
              number=$((${previous##*.} + 1))
            fi
            version="${version}-rc.${number}"
          elif [[ "$CHANNEL" != stable ]]; then
            printf 'Invalid release channel: %s\n' "$CHANNEL" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            printf 'Tag v%s already exists; refusing to reissue the version.\n' "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create local release tag
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"

      - name: Set up mise
        uses: jdx/mise-action@v5.2.6
        with:
          install: true
          cache: false

      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        # キャッシュは信頼できるデフォルトブランチのCIでのみ作成・保存され、安全に復元できるため問題ない
        # jactionlint ignore=cache-poisoning
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release browser WASM
        # 公開用WASMにはリリースバージョンを埋め込むため、共有WASMキャッシュを使わずにビルドする
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: mise run wasm:build

      - name: Stage release WebAssembly assets
        run: mise run release:wasm

      - name: Ensure default branch workflows are current
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet "origin/${GITHUB_REF_NAME}..${GITHUB_SHA}" -- .github/workflows/; then
            printf 'Default branch workflows changed since the release commit. Run a new Release from the latest commit.\n' >&2
            exit 1
          fi

      - name: Build release assets
        run: |
          set -euo pipefail
          goreleaser release --skip=publish --clean
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Verify released CLI version
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          tar -xOzf "dist/mcl_${VERSION}_linux_amd64.tar.gz" mcl > "$RUNNER_TEMP/mcl"
          chmod +x "$RUNNER_TEMP/mcl"
          actual="$("$RUNNER_TEMP/mcl" version | awk '{print $2}')"
          if [[ "$actual" != "$VERSION" ]]; then
            printf 'The release binary reports version %s, expected %s.\n' "$actual" "$VERSION" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mcl-${{ steps.target.outputs.version }}
          path: |
            dist/mcl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Set up pnpm
        run: corepack enable && pnpm --version

      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile

      - name: Set npm package versions
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix packages/browser pkg set "version=$VERSION"
          npm --prefix packages/language pkg set "version=$VERSION"

      - name: Generate reference package contents
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: mise run release:reference

      - name: Pack and verify npm packages
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: scripts/verify-package-tarballs.sh "${RUNNER_TEMP}/mcl-npm-packages"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mcl-npm-${{ steps.target.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  attest:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/mcl_*

  publish_release:
    needs: [release, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check existing release before publishing
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" \
            --json isDraft --jq '.' 2>/dev/null > "$RUNNER_TEMP/existing-release.json"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_draft="$(cat "$RUNNER_TEMP/existing-release.json")"
          if [ "$is_draft" = "false" ]; then
            printf 'Validating published release %s ...\n' "$RELEASE_TAG" >&2
            gh release verify "$RELEASE_TAG" --quiet 2>/dev/null || true
            for asset in dist/mcl_* dist/SHA256SUMS; do
              if [ -f "$asset" ]; then
                gh release verify-asset "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  "$asset" 2>/dev/null || true
              fi
            done
            printf 'Release %s is already published.\n' "$RELEASE_TAG" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Removing incomplete draft for %s before retrying ...\n' "$RELEASE_TAG" >&2
          gh release delete "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes 2>/dev/null || true
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish-release
        if: steps.existing-release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          RELEASE_TITLE: MCL ${{ needs.release.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            dist/mcl_*
            dist/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --generate-notes
          )
          if [[ "$CHANNEL" == rc ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"

  publish_npm:
    needs: [release, publish_release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-npm-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Verify npm package tarballs
        run: |
          set -euo pipefail
          count=$(find "${{ runner.temp }}/mcl-npm-packages" -name '*.tgz' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No npm package tarballs found in the downloaded artifact." >&2
            exit 1
          fi

      - name: Publish Browser SDK to npm
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: ${{ runner.temp }}/mcl-npm-packages/manifest-configuration-language-browser-${{ needs.release.outputs.version }}.tgz
          access: public
          provenance: true
          strategy: all
          tag: ${{ inputs.channel == 'rc' && 'next' || 'latest' }}

      - name: Publish Language Package to npm
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: ${{ runner.temp }}/mcl-npm-packages/manifest-configuration-language-language-${{ needs.release.outputs.version }}.tgz
          access: public
          provenance: true
          strategy: all
          tag: ${{ inputs.channel == 'rc' && 'next' || 'latest' }}
