name: Release
run-name: Release next ${{ inputs.bump }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ幅"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "公開チャネル"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    cache-mode: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.tag }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Release workflows must run from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Wait for successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout=600
          interval=15
          deadline=$((SECONDS + timeout))
          while true; do
            result="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch main \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json headSha,status,conclusion \
              --jq '.[0] | [.headSha, .status, .conclusion] | @tsv')" || {
              printf 'Failed to query CI runs for %s.\n' "$GITHUB_SHA" >&2
              exit 1
            }
            sha=""
            status=""
            conclusion=""
            if [[ -n "$result" ]]; then
              IFS=$'\t' read -r sha status conclusion <<< "$result"
            fi
            if [[ "$sha" == "$GITHUB_SHA" && "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                printf 'Main CI succeeded for %s.\n' "$GITHUB_SHA"
                exit 0
              fi
              printf 'Main CI for %s concluded with %s.\n' "$GITHUB_SHA" "$conclusion" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              printf 'Timed out after %ss waiting for main CI on %s (status: %s).\n' \
                "$timeout" "$GITHUB_SHA" "${status:-not started}" >&2
              exit 1
            fi
            sleep "$interval"
          done

      - name: Determine release version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            printf 'A stable vX.Y.Z tag is required to determine the next version.\n' >&2
            exit 1
          fi
          if [[ "$CHANNEL" == stable && "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            printf 'Commit %s is already released as %s.\n' "$GITHUB_SHA" "$latest" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              printf 'Invalid version bump: %s\n' "$BUMP" >&2
              exit 1
              ;;
          esac
          version="${major}.${minor}.${patch}"
          if [[ "$CHANNEL" == rc ]]; then
            previous="$(git tag --list "v${version}-rc.*" | sort -V | tail -n 1)"
            number=1
            if [[ -n "$previous" ]]; then
              if [[ "$(git rev-list -n 1 "$previous")" == "$GITHUB_SHA" ]]; then
                printf 'Commit %s is already released as %s.\n' "$GITHUB_SHA" "$previous" >&2
                exit 1
              fi
              number=$((${previous##*.} + 1))
            fi
            version="${version}-rc.${number}"
          elif [[ "$CHANNEL" != stable ]]; then
            printf 'Invalid release channel: %s\n' "$CHANNEL" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            printf 'Tag v%s already exists; refusing to reissue the version.\n' "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create local release tag
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: false

      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        # キャッシュは信頼できるデフォルトブランチのCIでのみ作成・保存され、安全に復元できるため問題ない
        # jactionlint ignore=cache-poisoning
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release browser WASM
        # 公開用WASMにはリリースバージョンを埋め込むため、共有WASMキャッシュを使わずにビルドする
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: mise run wasm:build

      - name: Stage release WebAssembly assets
        run: mise run release:wasm

      - name: Ensure default branch workflows are current
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet "origin/${GITHUB_REF_NAME}..${GITHUB_SHA}" -- .github/workflows/; then
            printf 'Default branch workflows changed since the release commit. Run a new Release from the latest commit.\n' >&2
            exit 1
          fi

      - name: Build release assets
        run: |
          set -euo pipefail
          goreleaser release --skip=publish --clean
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Verify released CLI version
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          tar -xOzf "dist/mcl_${VERSION}_linux_amd64.tar.gz" mcl > "$RUNNER_TEMP/mcl"
          chmod +x "$RUNNER_TEMP/mcl"
          actual="$("$RUNNER_TEMP/mcl" version | awk '{print $2}')"
          if [[ "$actual" != "$VERSION" ]]; then
            printf 'The release binary reports version %s, expected %s.\n' "$actual" "$VERSION" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-${{ steps.target.outputs.version }}
          path: |
            dist/mcl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Set up pnpm
        run: corepack enable && pnpm --version

      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile

      - name: Set npm package versions
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix packages/browser pkg set "version=$VERSION"
          npm --prefix packages/language pkg set "version=$VERSION"

      - name: Generate reference package contents
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: mise run release:reference

      - name: Pack and verify npm packages
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: scripts/verify-package-tarballs.sh "${RUNNER_TEMP}/mcl-npm-packages"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-npm-${{ steps.target.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  attest:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mcl_*

  publish_release:
    needs: [release, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish attested GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          prerelease_args=()
          latest_args=()
          if [[ "$CHANNEL" == rc ]]; then
            prerelease_args+=(--prerelease)
            latest_args+=(--latest=false)
          else
            latest_args+=(--latest)
          fi
          existing_draft=false

          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "+refs/tags/*:refs/tags/*"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            is_draft="$(jq -r '.isDraft' "$RUNNER_TEMP/existing-release.json")"
            if [ "$is_draft" != true ]; then
              existing_assets="$(mktemp -d)"
              trap 'rm -rf "$existing_assets"' EXIT
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$existing_assets" \
                --pattern 'mcl_*' \
                --pattern SHA256SUMS
              cmp dist/SHA256SUMS "$existing_assets/SHA256SUMS"
              (cd "$existing_assets" && sha256sum --check SHA256SUMS)

              tag_sha=""
              if [ -n "$(git ls-remote --tags --refs --exit-code origin "$tag" 2>/dev/null)" ]; then
                read -r _local _remote <<< "$(git ls-remote --tags --refs origin "$tag")"
                if [ "$_remote" != "$(git rev-parse "v${VERSION}")" ]; then
                  printf 'Published release %s points to a different commit than expected.\n' "$tag" >&2
                  exit 1
                fi
              fi

              printf 'Release %s is already published with matching assets and tag.\n' "$tag"
              exit 0
            fi
            existing_draft=true
          fi

          if ! git diff --quiet \
            "origin/${DEFAULT_BRANCH}" \
            "${GITHUB_SHA}" \
            -- .github/workflows/; then
            printf 'Default branch workflows have been modified since the release commit. Start a new Release run from the latest commit.\n' >&2
            exit 1
          fi

          if [[ "$existing_draft" == true ]]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi

          target_args=()
          tag_sha=""
          if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)" && \
             [ "$tag_sha" = "$GITHUB_SHA" ]; then
            : # tag already points to this commit
          else
            target_args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/mcl_* dist/SHA256SUMS \
            "${prerelease_args[@]}" \
            "${latest_args[@]}" \
            "${target_args[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "MCL $VERSION" \
            --generate-notes

          is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != true ]; then
            printf 'Expected release %s to remain a draft until asset attestation succeeds.\n' "$tag" >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${latest_args[@]}"

  publish_npm:
    needs: [release, publish_release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml

      - name: Download npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-npm-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Publish packages with provenance
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          node scripts/publish-npm-packages.mjs "$RUNNER_TEMP/mcl-npm-packages" "$MCL_VERSION" "$CHANNEL"
