name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.target.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release target
        id: target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$release_tag" >&2
            exit 1
          fi
          for package in browser language; do
            package_version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "v$package_version" != "$release_tag" ]; then
              printf 'Release tag %s does not match %s package version %s\n' "$release_tag" "$package" "$package_version" >&2
              exit 1
            fi
          done
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Set up pnpm
        run: corepack enable && pnpm --version

      - name: Verify release
        uses: ./.github/actions/verify-release
        with:
          package-output-directory: ${{ runner.temp }}/mcl-npm-packages
          expected-version: ${{ steps.target.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-npm-${{ steps.target.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Build release assets
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          goreleaser release --skip=publish --clean
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-${{ steps.target.outputs.version }}
          path: |
            dist/mcl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  attest:
    needs: release
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/mcl_*

  publish_release:
    needs: [release, attest]
    if: ${{ always() && needs.release.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Publish attested GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            is_draft="$(jq -r '.isDraft' "$RUNNER_TEMP/existing-release.json")"
            if [ "$is_draft" != true ]; then
              existing_assets="$(mktemp -d)"
              trap 'rm -rf "$existing_assets"' EXIT
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$existing_assets" \
                --pattern 'mcl_*' \
                --pattern SHA256SUMS
              cmp dist/SHA256SUMS "$existing_assets/SHA256SUMS"
              (cd "$existing_assets" && sha256sum --check SHA256SUMS)
              printf 'Release %s is already published with matching assets.\n' "$tag"
              exit 0
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$tag" dist/mcl_* dist/SHA256SUMS \
            "${prerelease_args[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "MCL $VERSION" \
            --generate-notes

          is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != true ]; then
            printf 'Expected release %s to remain a draft until asset attestation succeeds.\n' "$tag" >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

  publish_npm:
    needs: [release, publish_release]
    if: ${{ always() && needs.release.result == 'success' && needs.publish_release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Download npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-npm-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Publish packages with provenance
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
        run: |
          node scripts/publish-npm-packages.mjs "$RUNNER_TEMP/mcl-npm-packages" "$MCL_VERSION"

      - name: Wait for npm registry propagation
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          attempt=1
          while ! npm view --prefer-online "@manifest-configuration-language/browser@$MCL_VERSION" version >/dev/null 2>&1 || ! npm view --prefer-online "@manifest-configuration-language/language@$MCL_VERSION" version >/dev/null 2>&1; do
            if [ "$attempt" -ge 30 ]; then
              printf 'npm registry did not expose all MCL %s packages within fifteen minutes.\n' "$MCL_VERSION" >&2
              exit 1
            fi
            sleep 30
            attempt=$((attempt + 1))
          done

      - name: Install and verify published packages
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          cat > "$smoke_directory/package.json" <<EOF
          {"private":true,"dependencies":{"@manifest-configuration-language/browser":"$MCL_VERSION","@manifest-configuration-language/language":"$MCL_VERSION"}}
          EOF
          npm install --prefix "$smoke_directory" --ignore-scripts --no-audit --no-fund
          (cd "$smoke_directory" && npm audit signatures)
          cp "$GITHUB_WORKSPACE/scripts/verify-installed-packages.mjs" "$smoke_directory/verify-installed-packages.mjs"
          (cd "$smoke_directory" && node verify-installed-packages.mjs)
