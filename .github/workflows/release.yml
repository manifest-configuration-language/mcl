name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.target.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release target
        id: target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$release_tag" >&2
            exit 1
          fi
          for package in browser language; do
            package_version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "v$package_version" != "$release_tag" ]; then
              printf 'Release tag %s does not match %s package version %s\n' "$release_tag" "$package" "$package_version" >&2
              exit 1
            fi
          done
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Verify release
        uses: ./.github/actions/verify-release
        with:
          package-output-directory: ${{ runner.temp }}/mcl-npm-packages
          expected-version: ${{ steps.target.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-npm-${{ steps.target.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Build release assets
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
          MCL_RELEASE_MODE: release
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run release:package

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-${{ steps.target.outputs.version }}
          path: |
            dist/mcl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: release
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/mcl_*

  publish_release:
    needs: [release, attest]
    if: ${{ always() && needs.release.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish attested GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != true ]; then
            printf 'Expected release %s to remain a draft until asset attestation succeeds.\n' "$tag" >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

  publish_npm:
    needs: [release, publish_release]
    if: ${{ always() && needs.release.result == 'success' && needs.publish_release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-npm-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Verify npm package tarballs
        id: packages
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          package_directory="$RUNNER_TEMP/mcl-npm-packages"
          expected_files="manifest-configuration-language-browser-${MCL_VERSION}.tgz
          manifest-configuration-language-language-${MCL_VERSION}.tgz
          SHA512SUMS"
          actual_files="$(for file in "$package_directory"/*; do [ -f "$file" ] && basename "$file"; done | sort)"
          if [ "$actual_files" != "$(printf '%s\n' "$expected_files" | sort)" ]; then
            printf 'Unexpected npm tarball artifact files:\n%s\n' "$actual_files" >&2
            exit 1
          fi
          (cd "$package_directory" && sha512sum --check SHA512SUMS)

          publish_list="$RUNNER_TEMP/packages-to-publish.txt"
          : > "$publish_list"
          for package in browser language; do
            tarball="$package_directory/manifest-configuration-language-${package}-${MCL_VERSION}.tgz"
            expected_integrity="sha512-$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
            registry_error="$RUNNER_TEMP/${package}-registry-check.txt"
            if registry_integrity="$(npm view "@manifest-configuration-language/$package@$MCL_VERSION" dist.integrity 2>"$registry_error")"; then
              if [ "$registry_integrity" != "$expected_integrity" ]; then
                printf "Published @manifest-configuration-language/%s@%s does not match this run's tarball (expected %s, found %s).\n" \
                  "$package" "$MCL_VERSION" "$expected_integrity" "$registry_integrity" >&2
                exit 1
              fi
              printf 'Verified existing @manifest-configuration-language/%s@%s against this run tarball.\n' "$package" "$MCL_VERSION"
            elif ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
              cat "$registry_error" >&2
              printf 'Could not verify npm package availability for @manifest-configuration-language/%s@%s.\n' "$package" "$MCL_VERSION" >&2
              exit 1
            else
              printf '%s\n' "$package" >> "$publish_list"
            fi
          done
          echo "publish_list=$publish_list" >> "$GITHUB_OUTPUT"

      - name: Publish packages with provenance
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
          PUBLISH_LIST: ${{ steps.packages.outputs.publish_list }}
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            npm publish "$RUNNER_TEMP/mcl-npm-packages/manifest-configuration-language-${package}-${MCL_VERSION}.tgz" --access public --provenance
          done < "$PUBLISH_LIST"

      - name: Smoke test published packages
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          cat > "$smoke_directory/package.json" <<EOF
          {"private":true,"dependencies":{"@manifest-configuration-language/browser":"$MCL_VERSION","@manifest-configuration-language/language":"$MCL_VERSION"}}
          EOF
          npm install --prefix "$smoke_directory" --ignore-scripts --no-audit --no-fund
          (cd "$smoke_directory" && npm audit signatures)
          cp "$GITHUB_WORKSPACE/scripts/verify-installed-packages.mjs" "$smoke_directory/verify-installed-packages.mjs"
          (cd "$smoke_directory" && node verify-installed-packages.mjs)
