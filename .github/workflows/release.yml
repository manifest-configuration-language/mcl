name: Release
run-name: Release next ${{ inputs.bump }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ幅"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "公開チャネル"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.tag }}
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Release workflows must run from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Wait for main CI to appear
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout=60
          deadline=$((SECONDS + timeout))
          while true; do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch main \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || true)"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              printf 'Timed out after %ss waiting for CI to register.\n' \
                "$timeout" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Wait for main CI to finish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        run: |
          gh run watch "$RUN_ID" --exit-status --compact

      - name: Determine release version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            printf 'A stable vX.Y.Z tag is required to determine the next version.\n' >&2
            exit 1
          fi

          # Reuse when SHA already has the latest release.
          existing_release_tag="$(gh release view "$latest" \
            --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$CHANNEL" == stable && \
                "$existing_release_tag" == "$latest" && \
                "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            version="${latest#v}"
            printf 'Commit %s already has release %s; resuming publication.\n' \
              "$GITHUB_SHA" "$latest" >&2
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Search for any existing tag pointing to this SHA and resume.
          prev="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+(-rc\.[0-9]+))?$' |
            while read -r tag; do
              if [[ "$(git rev-list -n 1 "$tag")" == "$GITHUB_SHA" ]]; then
                echo "$tag"
                break
              fi
            done)
          if [ -n "$prev" ]; then
            prev_release="$(gh release view "$prev" \
              --json tagName --jq '.tagName' 2>/dev/null || true)"
            if [[ "$CHANNEL" == stable && "$prev_release" != "$prev" ]]; then
              printf 'Tag %s points to commit %s but has no release.\n' \
                "$prev" "$GITHUB_SHA" >&2
              exit 1
            fi
            printf 'Commit %s already has tag %s; resuming publication.\n' \
              "$GITHUB_SHA" "$prev" >&2
            echo "version=${prev#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$prev" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard: refuse to create a newer version from an older commit.
          if [[ "$(git rev-list -n 1 "$latest")" != "$GITHUB_SHA" ]] && \
             git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then
            printf 'Refusing to release %s: commit %s is older than latest release %s.\n' \
              "${GITHUB_REF##refs/heads/}" "$GITHUB_SHA" "$latest" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              printf 'Invalid version bump: %s\n' "$BUMP" >&2
              exit 1
              ;;
          esac
          version="${major}.${minor}.${patch}"
          if [[ "$CHANNEL" == rc ]]; then
            previous="$(git tag --list "v${version}-rc.*" | sort -V | tail -n 1)"
            number=1
            if [[ -n "$previous" ]]; then
              if [[ "$(git rev-list -n 1 "$previous")" == "$GITHUB_SHA" ]]; then
                existing_release_tag="$(gh release view "$previous" --json tagName --jq '.tagName' 2>/dev/null || true)"
                if [[ "$existing_release_tag" == "$previous" ]]; then
                  version="${previous#v}"
                  printf 'Commit %s already has release %s; resuming publication.\n' "$GITHUB_SHA" "$previous" >&2
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=$previous" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                printf 'Tag %s already points to commit %s but has no release.\n' "$previous" "$GITHUB_SHA" >&2
                exit 1
              fi
              number=$((${previous##*.} + 1))
            fi
            version="${version}-rc.${number}"
          elif [[ "$CHANNEL" != stable ]]; then
            printf 'Invalid release channel: %s\n' "$CHANNEL" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            printf 'Tag v%s already exists; refusing to reissue the version.\n' "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build-cli:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    permissions:
      contents: read
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MCL_VERSION: ${{ needs.prepare.outputs.version }}
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go
          cache: true

      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-
      - name: Build CLI
        run: |
          go build -trimpath \
            -ldflags="-s -w -X=github.com/manifest-configuration-language/mcl/internal/engine.toolchainVersionOverride=${VERSION}" \
            -o "mcl${{ matrix.os == 'windows' && '.exe' || '' }}" \
            ./cmd/mcl

      - name: Create archive
        run: |
          mkdir -p dist
          if [[ "${GOOS}" == "windows" ]]; then
            zip -q "dist/mcl_${VERSION}_${GOOS}_${GOARCH}.zip" mcl.exe
          else
            tar -czf "dist/mcl_${VERSION}_${GOOS}_${GOARCH}.tar.gz" mcl
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: dist/mcl_${{ env.VERSION }}_${{ env.GOOS }}_${{ env.GOARCH }}.${{ matrix.os == 'windows' && 'zip' || 'tar.gz' }}
          format: spdx-json
          output-file: dist/mcl_${{ env.VERSION }}_${{ env.GOOS }}_${{ env.GOARCH }}.${{ matrix.os == 'windows' && 'zip' || 'tar.gz' }}.sbom.json
          upload-artifact: false

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  build-wasm:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      VERSION: ${{ needs.prepare.outputs.version }}
      MCL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: >-
            go node
            aqua:WebAssembly/binaryen
          cache: true

      - name: Set up pnpm
        run: corepack enable && pnpm --version

      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile

      - name: Build browser WASM
        run: mise run wasm:build

      - name: Stage release WebAssembly assets
        run: mise run release:wasm

      - name: Set npm package versions
        run: |
          set -euo pipefail
          npm --prefix packages/browser pkg set "version=$VERSION"
          npm --prefix packages/language pkg set "version=$VERSION"

      - name: Generate reference package contents
        run: mise run release:reference

      - name: Pack and verify npm packages
        run: scripts/verify-package-tarballs.sh "${RUNNER_TEMP}/mcl-npm-packages"

      - name: Package WASM release assets
        run: |
          mkdir -p dist
          tar -czf "dist/mcl_${VERSION}_wasm.tar.gz" \
            -C .build/release-assets mcl.wasm.gz wasm_exec.js

      - name: Generate SBOM for WASM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: dist/mcl_${{ env.VERSION }}_wasm.tar.gz
          format: spdx-json
          output-file: dist/mcl_${{ env.VERSION }}_wasm.tar.gz.sbom.json
          upload-artifact: false

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-release
          path: dist/
          compression-level: 0
          if-no-files-found: error

      - name: Upload npm packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mcl-npm-${{ env.VERSION }}
          path: ${{ runner.temp }}/mcl-npm-packages/
          compression-level: 0
          if-no-files-found: error

  assemble:
    needs: [prepare, build-cli, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Download WASM release assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-release
          path: dist

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          tar -xOzf "dist/mcl_${VERSION}_linux_amd64.tar.gz" mcl > "$RUNNER_TEMP/mcl"
          chmod +x "$RUNNER_TEMP/mcl"
          version="$("$RUNNER_TEMP/mcl" version | awk '{print $2}')"
          if [ "$version" != "${VERSION}" ]; then
            printf 'Release binary version %s does not match expected %s.\n' \
              "$version" "${VERSION}" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Upload release bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mcl-${{ env.VERSION }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  attest:
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/mcl_*

  publish_release:
    needs: [prepare, assemble, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Check existing draft for re-run
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          if ! is_draft="$(gh release view "$RELEASE_TAG" \
            --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            printf 'Removing incomplete draft for %s before retrying ...\n' "$RELEASE_TAG" >&2
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes 2>/dev/null || true
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Release %s is already published.\n' "$RELEASE_TAG" >&2
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish-release
        if: steps.existing-release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TITLE: MCL ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            dist/mcl_*
            dist/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --generate-notes
          )
          if [[ "$CHANNEL" == rc ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"

  publish_npm:
    needs: [prepare, publish_release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and npm
        uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: node
          cache: false

      - name: Verify Node and npm versions
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Download npm packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-npm-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Publish Browser SDK to npm
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: ${{ runner.temp }}/mcl-npm-packages/manifest-configuration-language-browser-${{ needs.prepare.outputs.version }}.tgz
          access: public
          provenance: true
          strategy: all
          tag: ${{ inputs.channel == 'rc' && 'next' || 'latest' }}

      - name: Publish Language Package to npm
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: ${{ runner.temp }}/mcl-npm-packages/manifest-configuration-language-language-${{ needs.prepare.outputs.version }}.tgz
          access: public
          provenance: true
          strategy: all
          tag: ${{ inputs.channel == 'rc' && 'next' || 'latest' }}
