name: Release
run-name: Release next ${{ inputs.bump }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ幅"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "公開チャネル"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.target.outputs.version }}
      release_tag: ${{ steps.target.outputs.tag }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Release workflows must run from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --event push \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')"
          if [ "$result" != "$GITHUB_SHA" ]; then
            printf 'No successful main CI run found for %s.\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Determine release version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            printf 'A stable vX.Y.Z tag is required to determine the next version.\n' >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              printf 'Invalid version bump: %s\n' "$BUMP" >&2
              exit 1
              ;;
          esac
          version="${major}.${minor}.${patch}"
          if [[ "$CHANNEL" == rc ]]; then
            previous="$(git tag --list "v${version}-rc.*" | sort -V | tail -n 1)"
            number=1
            if [[ -n "$previous" ]]; then
              number=$((${previous##*.} + 1))
            fi
            version="${version}-rc.${number}"
          elif [[ "$CHANNEL" != stable ]]; then
            printf 'Invalid release channel: %s\n' "$CHANNEL" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            printf 'Tag v%s already exists; refusing to reissue the version.\n' "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create local release tag
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: false

      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        # キャッシュは信頼できるデフォルトブランチのCIでのみ作成・保存され、安全に復元できるため問題ない
        # jactionlint ignore=cache-poisoning
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare browser WASM
        uses: ./.github/actions/prepare-wasm

      - name: Stage release WebAssembly assets
        run: mise run release:wasm

      - name: Build release assets
        run: |
          set -euo pipefail
          goreleaser release --skip=publish --clean
          (cd dist && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-${{ steps.target.outputs.version }}
          path: |
            dist/mcl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Set up pnpm
        run: corepack enable && pnpm --version

      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile

      - name: Set npm package versions
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix packages/browser pkg set "version=$VERSION"
          npm --prefix packages/language pkg set "version=$VERSION"

      - name: Verify release
        uses: ./.github/actions/verify-release
        with:
          package-output-directory: ${{ runner.temp }}/mcl-npm-packages
          expected-version: ${{ steps.target.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-npm-${{ steps.target.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  attest:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mcl_*

  publish_release:
    needs: [release, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-${{ needs.release.outputs.version }}
          path: dist

      - name: Publish attested GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          prerelease_args=()
          if [[ "$CHANNEL" == rc ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            is_draft="$(jq -r '.isDraft' "$RUNNER_TEMP/existing-release.json")"
            if [ "$is_draft" != true ]; then
              existing_assets="$(mktemp -d)"
              trap 'rm -rf "$existing_assets"' EXIT
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$existing_assets" \
                --pattern 'mcl_*' \
                --pattern SHA256SUMS
              cmp dist/SHA256SUMS "$existing_assets/SHA256SUMS"
              (cd "$existing_assets" && sha256sum --check SHA256SUMS)
              printf 'Release %s is already published with matching assets.\n' "$tag"
              exit 0
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi

          target_args=()
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            target_args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/mcl_* dist/SHA256SUMS \
            "${prerelease_args[@]}" \
            "${target_args[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "MCL $VERSION" \
            --generate-notes

          is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != true ]; then
            printf 'Expected release %s to remain a draft until asset attestation succeeds.\n' "$tag" >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

  publish_npm:
    needs: [release, publish_release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Download npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-npm-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/mcl-npm-packages

      - name: Publish packages with provenance
        env:
          MCL_VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          node scripts/publish-npm-packages.mjs "$RUNNER_TEMP/mcl-npm-packages" "$MCL_VERSION" "$CHANNEL"
