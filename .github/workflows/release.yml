name: Release
run-name: Release ${{ inputs.release_tag || 'package version' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.2.3. Empty selects the matching npm package version.
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release target
        id: target
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "Run this workflow from the default branch." >&2
              exit 1
            fi
            release_tag="$RELEASE_TAG_INPUT"
            if [ -z "$release_tag" ]; then
              browser_version="$(node -p "require('./packages/browser/package.json').version")"
              language_version="$(node -p "require('./packages/language/package.json').version")"
              if [ "$browser_version" != "$language_version" ]; then
                printf 'Browser and language package versions differ: %s and %s\n' "$browser_version" "$language_version" >&2
                exit 1
              fi
              release_tag="v$browser_version"
            fi
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$release_tag" >&2
            exit 1
          fi
          for package in browser language; do
            package_version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "v$package_version" != "$release_tag" ]; then
              printf 'Release tag %s does not match %s package version %s\n' "$release_tag" "$package" "$package_version" >&2
              exit 1
            fi
            registry_error="$RUNNER_TEMP/${package}-registry-check.txt"
            if npm view "@mcl/$package@$package_version" version --json >/dev/null 2>"$registry_error"; then
              printf 'npm package @mcl/%s@%s already exists.\n' "$package" "$package_version" >&2
              exit 1
            elif ! grep -Eq 'E404|404 Not Found' "$registry_error"; then
              cat "$registry_error" >&2
              printf 'Could not verify npm package availability for @mcl/%s@%s.\n' "$package" "$package_version" >&2
              exit 1
            fi
          done
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Release tag $release_tag already exists." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Get Go cache paths
        id: go-cache-paths
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build and module data
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Run release checks
        run: mise run quality:check

      - name: Validate GoReleaser configuration
        run: goreleaser check

      - name: Build release assets
        env:
          MCL_VERSION: ${{ steps.target.outputs.version }}
        run: mise run release:package

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-${{ steps.target.outputs.version }}
          path: |
            dist/mcl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      # GitHub FreeではPrivateリポジトリのArtifact Attestationを利用できないため、公開時のみ生成します。
      - name: Attest release assets
        if: github.repository_visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/mcl_*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/mcl_* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MCL $RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"

  publish_packages:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch npm package publishing
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          run_name="Publish npm packages $RELEASE_TAG"
          dispatch_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run publish-packages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "release_tag=$RELEASE_TAG"

          deadline=$((SECONDS + 300))
          run_id=""
          while [ -z "$run_id" ]; do
            runs="$(gh run list --workflow publish-packages.yml --event workflow_dispatch \
              --branch "$DEFAULT_BRANCH" --limit 20 --json databaseId,displayTitle,createdAt)"
            run_id="$(jq -r --arg title "$run_name" --arg after "$dispatch_time" \
              '[.[] | select(.displayTitle == $title and .createdAt >= $after)] | sort_by(.createdAt) | last | .databaseId // empty' \
              <<< "$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for npm publishing workflow to start." >&2
              exit 1
            fi
            sleep 5
          done

          gh run watch "$run_id" --exit-status --interval 10
