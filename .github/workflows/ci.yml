name: MCL core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - name: Set up pnpm
        run: corepack enable && pnpm --version
      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile
      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Run project quality checks
        run: mise run quality:check
      - name: Prepare release WebAssembly assets
        run: mise run release:wasm
      - name: Lint GitHub Actions workflows
        run: mise run actions:lint
      - name: Run Browser SDK unit tests
        run: pnpm --filter @manifest-configuration-language/browser run test:unit
      - name: Check language grammar parity
        run: pnpm --filter @manifest-configuration-language/language run check:parity
      - name: Pack and verify npm packages
        run: scripts/verify-package-tarballs.sh --prebuilt-browser-wasm
      - name: Check generated protocol sources are current
        run: |
          go generate ./cmd/mcl-wasm
          pnpm --filter @manifest-configuration-language/browser run generate:protocol
          git diff --exit-code -- internal/wasmprotocol/protocol.go internal/wasmprotocol/limits.go packages/browser/src/protocol.d.ts packages/browser/src/limits.js
