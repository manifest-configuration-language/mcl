name: MCL core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Run project quality checks
        run: mise run quality:check
      - name: Lint GitHub Actions workflows
        run: mise run actions:lint
      - name: Run browser runtime smoke test
        run: cd packages/browser && npm ci && npx playwright install --with-deps chromium && npm run test:browser
      - name: Check language grammar parity
        run: cd packages/language && npm ci && npm run check:parity
