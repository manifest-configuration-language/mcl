name: MCL core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          cache: true
      - name: Set up pnpm
        run: corepack enable && pnpm --version
      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile
      - name: Apply CI package version
        id: package-version
        run: |
          set -euo pipefail
          version="0.0.0-ci.${GITHUB_SHA:0:12}"
          npm --prefix packages/browser pkg set "version=$version"
          npm --prefix packages/language pkg set "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache browser WebAssembly output
        # キャッシュは信頼できるデフォルトブランチのCIでのみ作成・保存され、安全に復元できるため問題ない
        # jactionlint ignore=cache-poisoning
        id: wasm-cache
        uses: actions/cache@v6.1.0
        with:
          path: packages/browser/dist/
          key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum', '**/*.go', 'internal/k8sschema/data/**', 'packages/browser/scripts/build-wasm.mjs') }}

      - name: Build browser WebAssembly
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: mise run wasm:build

      - name: Prepare release WebAssembly assets
        run: mise run release:wasm

      - name: Run project quality checks
        run: mise run quality:check
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Lint GitHub Actions workflows
        run: mise run lint:gha
      - name: Run Browser SDK unit tests
        run: pnpm --filter @manifest-configuration-language/browser run test:unit
      - name: Check language grammar parity
        run: pnpm --filter @manifest-configuration-language/language run check:parity
      - name: Check generated language parser
        run: git diff --exit-code -- packages/language/src/parser.js packages/language/src/parser.terms.js
      - name: Generate package reference contents
        env:
          MCL_VERSION: ${{ steps.package-version.outputs.version }}
        run: mise run release:reference
      - name: Pack and verify npm packages
        env:
          MCL_VERSION: ${{ steps.package-version.outputs.version }}
        run: scripts/verify-package-tarballs.sh "${RUNNER_TEMP}/mcl-packages"
      - name: Check generated protocol sources are current
        run: |
          go generate ./cmd/mcl-wasm
          pnpm --filter @manifest-configuration-language/browser run generate:protocol
          git diff --exit-code -- internal/wasmprotocol/protocol.go internal/wasmprotocol/limits.go packages/browser/src/protocol.ts packages/browser/src/limits.ts
