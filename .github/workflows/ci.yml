name: MCL core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          cache: true
      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        id: go-cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-
      - name: Run Go tests
        run: go test ./...
      - name: Save Go build and module data
        uses: actions/cache/save@v6.1.0
        if: >-
          ${{
            !cancelled() &&
            (steps.go-cache-restore.outputs.cache-hit != 'true' ||
             steps.go-cache-restore.outputs.cache-primary-key != steps.go-cache-restore.outputs.cache-matched-key)
          }}
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key || format('go-{0}-{1}-{2}-{3}', runner.os, runner.arch, steps.go-cache-paths.outputs.version, hashFiles('go.mod', 'go.sum')) }}
      - name: Lint Go source with golangci-lint
        run: golangci-lint run ./...
      - name: Check Go source formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          cache: true
      - name: Cache browser WebAssembly output
        id: wasm-cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: packages/browser/dist/
          key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum', '**/*.go', '.mise.toml', 'internal/k8sschema/data/**', 'packages/browser/scripts/build-wasm.mjs') }}
      - name: Build browser WebAssembly
        if: steps.wasm-cache-restore.outputs.cache-hit != 'true'
        run: mise run wasm:build
      - uses: actions/cache/save@v6.1.0
        if: >-
          ${{
            !cancelled() &&
            steps.wasm-cache-restore.outputs.cache-hit != 'true'
          }}
        with:
          path: packages/browser/dist/
          key: ${{ steps.wasm-cache-restore.outputs.cache-primary-key }}
      - name: Prepare release WebAssembly assets
        run: mise run release:wasm
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mcl-browser-dist
          path: packages/browser/dist/
          compression-level: 0

  verify:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          cache: true
      - name: Download browser dist artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcl-browser-dist
          path: packages/browser/dist/
      - name: Set up pnpm
        run: corepack enable && pnpm --version
      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile
      - name: Set CI package versions
        run: |
          set -euo pipefail
          version="0.0.0-ci.${GITHUB_SHA:0:12}"
          echo "MCL_VERSION=$version" >> "$GITHUB_ENV"
          npm --prefix packages/browser pkg set "version=$version"
          npm --prefix packages/language pkg set "version=$version"
      - name: Run independent verification steps in parallel
        timeout-minutes: 15
        run: |
          set -euo pipefail

          ( mise run lint:gha ) &
          lint_gha_pid=$!

          ( pnpm --filter @manifest-configuration-language/browser run test:unit ) &
          browser_test_pid=$!

          ( pnpm --filter @manifest-configuration-language/language run check:parity ) &
          parity_pid=$!

          ( mise run release:reference ) &
          reference_pid=$!

          wait "$lint_gha_pid" || exit $?
          wait "$browser_test_pid" || exit $?
          wait "$parity_pid" || exit $?
          wait "$reference_pid" || exit $?
      - name: Pack and verify npm packages
        run: scripts/verify-package-tarballs.sh "${RUNNER_TEMP}/mcl-packages"
      - name: Check generated protocol sources are current
        run: |
          go generate ./cmd/mcl-wasm
          pnpm --filter @manifest-configuration-language/browser run generate:protocol
          git diff --exit-code -- internal/wasmprotocol/protocol.go internal/wasmprotocol/limits.go packages/browser/src/protocol.ts packages/browser/src/limits.ts
