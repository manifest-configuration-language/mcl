name: Release candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - name: Select candidate version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            for package in browser language; do
              package_version="$(node -p "require('./packages/${package}/package.json').version")"
              if [ "$package_version" != "$version" ]; then
                printf 'Tag %s does not match %s package version %s\n' "$GITHUB_REF_NAME" "$package" "$package_version" >&2
                exit 1
              fi
            done
          else
            version="0.0.0-candidate.${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install browser package dependencies
        run: cd packages/browser && npm ci
      - name: Install Playwright browsers
        run: cd packages/browser && npx playwright install --with-deps chromium firefox webkit
      - name: Test browser package
        run: cd packages/browser && npm run test:browser
      - name: Validate browser package archive
        run: |
          set -euo pipefail
          cd packages/browser
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/browser-pack.json"
          node - "$RUNNER_TEMP/browser-pack.json" dist/mcl.wasm dist/wasm_exec.js <<'NODE'
          const fs = require('node:fs');
          const [archive, ...required] = process.argv.slice(2);
          const files = JSON.parse(fs.readFileSync(archive, 'utf8'))[0].files.map(({ path }) => path);
          const missing = required.filter((path) => !files.includes(path));
          if (missing.length) throw new Error(`Browser package is missing: ${missing.join(', ')}`);
          NODE
      - name: Install language package dependencies
        run: cd packages/language && npm ci
      - name: Check language grammar parity
        run: cd packages/language && npm run check:parity
      - name: Validate language package archive
        run: |
          set -euo pipefail
          cd packages/language
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/language-pack.json"
          node - "$RUNNER_TEMP/language-pack.json" src/parser.js src/mcl.tmLanguage.json <<'NODE'
          const fs = require('node:fs');
          const [archive, ...required] = process.argv.slice(2);
          const files = JSON.parse(fs.readFileSync(archive, 'utf8'))[0].files.map(({ path }) => path);
          const missing = required.filter((path) => !files.includes(path));
          if (missing.length) throw new Error(`Language package is missing: ${missing.join(', ')}`);
          NODE
      - name: Run release checks
        run: mise run quality:check
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Build release candidate assets
        env:
          MCL_VERSION: ${{ steps.version.outputs.version }}
        run: mise run release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-release-candidate
          path: dist/*
          if-no-files-found: error
