name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - name: Select candidate version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            for package in browser language; do
              package_version="$(node -p "require('./packages/${package}/package.json').version")"
              if [ "$package_version" != "$version" ]; then
                printf 'Tag %s does not match %s package version %s\n' "$GITHUB_REF_NAME" "$package" "$package_version" >&2
                exit 1
              fi
            done
          else
            version="0.0.0-candidate.${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify release
        uses: ./.github/actions/verify-release
      - name: Build release candidate assets
        env:
          MCL_VERSION: ${{ steps.version.outputs.version }}
          MCL_RELEASE_ASSETS_STAGED: true
        run: mise run release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-release-candidate
          path: dist/*
          if-no-files-found: error
