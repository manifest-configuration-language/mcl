name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true
      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up pnpm
        run: corepack enable && pnpm --version
      - name: Install npm package workspace
        run: pnpm install --frozen-lockfile
      - name: Select candidate version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            version="0.0.0-candidate.${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare browser WASM
        uses: ./.github/actions/prepare-wasm
      - name: Stage release WebAssembly assets
        run: mise run release:wasm
      - name: Set npm package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix packages/browser pkg set "version=$VERSION"
          npm --prefix packages/language pkg set "version=$VERSION"
      - name: Verify release
        uses: ./.github/actions/verify-release
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Build release candidate assets
        env:
          MCL_VERSION: ${{ steps.version.outputs.version }}
          MCL_RELEASE_ASSETS_STAGED: true
        run: mise run release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-release-candidate
          path: dist/*
          if-no-files-found: error
